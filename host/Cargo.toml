[package]
name = "bowser-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bowser-host"
path = "src/main.rs"

[dependencies]
# Pinned exactly: servo's embedding API is pre-1.0 and moves fast.
servo = "=0.5.0"
embedder_traits = { package = "servo-embedder-traits", version = "=0.5.0" }

# Versions matched to servo 0.5.0's workspace pins.
euclid = "0.22"
rustls = "0.23"
tracing = "0.1"
url = "2.5"
webrender_api = "0.70"
winit = "0.30.13"
