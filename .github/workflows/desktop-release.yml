name: Build desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    outputs:
      update-public-key: ${{ steps.update-key.outputs.public-key }}
      release-id: ${{ steps.identity.outputs.release-id }}
    permissions:
      contents: write
    env:
      BOWSER_TELEMETRY_DISABLED: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check R2 publication configuration
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          for name in ['R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY']:
              if not os.environ.get(name):
                  raise SystemExit(f'Add {name} to the release environment secrets before building')
          if not re.fullmatch('[a-fA-F0-9]{32}', os.environ['R2_ACCOUNT_ID']):
              raise SystemExit('R2_ACCOUNT_ID must be the Cloudflare account ID')
          PYTHON
      - name: Generate release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          python3 - <<'PYTHON'
          import datetime, os, re
          now = datetime.datetime.now(datetime.timezone.utc)
          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('Invalid source commit')
          build = now.strftime('%Y%m%d%H%M%S')
          release_id = f'{build}-{sha[:12]}'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'BOWSER_VERSION={now.year}.{now.month}.{now.day}\n')
              output.write(f'BOWSER_BUILD={build}\n')
              output.write(f'BOWSER_RELEASE_ID={release_id}\n')
              output.write(f"BOWSER_STAGE_FILE={os.environ['RUNNER_TEMP']}/bowser-stage-path\n")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'release-id={release_id}\n')
          print(f'Building Bowser {release_id}')
          PYTHON
      - name: Install Elixir and inspect toolchain
        run: |
          brew install elixir
          elixir --version
          swift --version
      - name: Test signing setup validation
        run: python3 -m unittest discover -s tests -p test_release_signing.py
      - name: Restore update signing key
        id: update-key
        env:
          UPDATE_KEY: ${{ secrets.BOWSER_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, pathlib
          value = base64.b64decode(os.environ['UPDATE_KEY'], validate=True)
          if len(value) != 32:
              raise SystemExit('BOWSER_UPDATE_PRIVATE_KEY_BASE64 must encode a 32-byte Ed25519 key')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bowser-update.key'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as file:
              file.write(value)
          PY
          public_key="$(bin/sign-update --public-key "$RUNNER_TEMP/bowser-update.key")"
          echo "BOWSER_UPDATE_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"
          echo "public-key=$public_key" >> "$GITHUB_OUTPUT"
      - name: Prepare Apple signing and notarization
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bin/setup-release-signing
      - name: Verify release contracts
        run: |
          swift test --package-path shell --filter 'UpdateTests|TelemetryTests|ModSmithTests|OnboardingTests'
          swift build --package-path shell --product BowserRuntimeTool
          python3 -m unittest discover -s tests -p test_apply_update.py
          python3 -m unittest discover -s tests -p test_notarize.py
      - name: Build fresh application and runtime
        run: bin/install --stage-only
      - name: Sign and notarize DMG, then sign final update metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          bin/package-dmg "$(cat "$BOWSER_STAGE_FILE")" "$PWD/dist/Bowser.dmg"
          bin/sign-update "$RUNNER_TEMP/bowser-update.key" "$PWD/dist/Bowser.dmg" "$BOWSER_VERSION" "$BOWSER_BUILD" 15 "$PWD/dist/stable.json"
          (cd dist && shasum -a 256 Bowser.dmg stable.json > SHA256SUMS)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bowser-${{ steps.identity.outputs.release-id }}-arm64
          path: |
            dist/Bowser.dmg
            dist/stable.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Apple Silicon build. Contains the standalone browser and bundled runtime.

          Developer ID signed and Apple-notarized. Both Bowser.app and the DMG carry stapled notarization tickets. The publish-assets job makes this build publicly downloadable and promotes its update feed automatically.

          The Ed25519-signed stable.json is paired with this exact DMG and expires after 30 days. The publish-assets job uploads to assets.bowser.app and promotes the signed manifest last. The GitHub draft is a separate release record.
          NOTES
          gh release create "build-$BOWSER_RELEASE_ID" dist/Bowser.dmg dist/stable.json dist/SHA256SUMS \
            --draft --target "$RELEASE_COMMIT" --title "Bowser $BOWSER_RELEASE_ID" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/bowser-update.key" "$RUNNER_TEMP/bowser-signing.p12"
          if [ -f "$RUNNER_TEMP/bowser-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/bowser-signing.keychain-db"
          fi

  publish-assets:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Bowser-${{ needs.build.outputs.release-id }}-arm64
          path: dist
      - name: Install R2 publishing dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/r2-tools"
          "$RUNNER_TEMP/r2-tools/bin/pip" install -r release/requirements.txt
      - name: Test publication integrity and ordering
        run: '"$RUNNER_TEMP/r2-tools/bin/python" -B -m unittest discover -s tests -p test_publish_r2.py'
      - name: Verify and publish signed assets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'bowser' }}
          BOWSER_UPDATE_PUBLIC_KEY: ${{ needs.build.outputs.update-public-key }}
        run: '"$RUNNER_TEMP/r2-tools/bin/python" release/publish_r2.py'
