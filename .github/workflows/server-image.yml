name: Build website and API image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'
      - name: Test website and API contracts
        working-directory: server
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix test
      - name: Build and smoke-test native container
        run: |
          docker build -f server/Dockerfile -t bowser-server:local .
          python3 server/test/docker_smoke.py
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}/server:sha-$REVISION-$ARCH"
          docker tag bowser-server:local "$image"
          docker push "$image"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image reference
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}/server"
          docker buildx imagetools create --tag "$image:sha-$REVISION" \
            "$image:sha-$REVISION-amd64" "$image:sha-$REVISION-arm64"
          docker buildx imagetools inspect "$image:sha-$REVISION" | tee image.txt
          {
            echo '### Website and API image'
            echo "Reference: \`$image:sha-$REVISION\`"
            echo 'Use the manifest digest below for a fixed deployment. This workflow does not deploy.'
            echo '```'
            cat image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
